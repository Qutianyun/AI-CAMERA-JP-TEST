<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>AI CAMERA JP Mobile Recognizer V2 Fullscreen</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.stage{position:fixed;inset:0;background:#000;overflow:hidden}video,canvas{position:absolute;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000}.hidden{display:none!important}.overlay{position:absolute;inset:0;z-index:10;pointer-events:none}.box{position:absolute;border-radius:4px;pointer-events:none}.match{border:3px solid #22c55e;background:rgba(34,197,94,.08)}.suspect{border:3px solid #f59e0b;background:rgba(245,158,11,.08)}.fail{border:3px solid #ef4444;background:rgba(239,68,68,.08)}.roi{border:3px dashed rgba(59,130,246,.75);background:rgba(59,130,246,.04)}.controls{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;gap:10px;padding:0 10px}.btn{border:0;border-radius:16px;color:#fff;font-weight:900;font-size:16px;padding:14px 16px;min-width:106px;box-shadow:0 8px 22px rgba(0,0,0,.26)}#startBtn{background:#16a34a}#shotBtn{background:#2563eb}#doneBtn{background:#dc2626}.btn:disabled{opacity:.45}.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:40;pointer-events:none;transition:opacity .18s}.flash.on{opacity:.55}@media(max-width:390px){.btn{font-size:15px;min-width:96px;padding:13px 12px}.controls{gap:8px}}
</style>
</head>
<body>
<div class="stage"><video id="video" playsinline muted autoplay></video><canvas id="canvas" class="hidden"></canvas><div id="overlay" class="overlay"></div></div>
<div class="controls"><button class="btn" id="startBtn">打开摄像头</button><button class="btn" id="shotBtn" disabled>拍照识别</button><button class="btn" id="doneBtn" disabled>完成释放</button></div>
<div class="flash" id="flash"></div>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
let stream=null,memory=[],lastLines=[],photoMode=false,lastRoi=null;const DUP_THRESHOLD=.78,SUSPECT_THRESHOLD=.68;
function log(){/* no visible text by design */}
async function loadMemory(){try{const r=await fetch('AI_CAMERA_JP_LINE_MEMORY_V7.json',{cache:'no-store'});const j=await r.json();memory=(j.items||[]).filter(x=>x.features||x.vector)}catch(e){memory=[]}}
function coverMap(){const vw=innerWidth,vh=innerHeight,iw=canvas.width||video.videoWidth||1,ih=canvas.height||video.videoHeight||1,s=Math.max(vw/iw,vh/ih),ox=(vw-iw*s)/2,oy=(vh-ih*s)/2;return{s,ox,oy}}
async function startCamera(){try{if(stream)stopCamera(false);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();photoMode=false;canvas.classList.add('hidden');video.classList.remove('hidden');overlay.innerHTML='';document.getElementById('shotBtn').disabled=false;document.getElementById('doneBtn').disabled=false;document.getElementById('startBtn').disabled=true}catch(e){}}
function stopCamera(clear=true){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;document.getElementById('shotBtn').disabled=true;document.getElementById('doneBtn').disabled=true;document.getElementById('startBtn').disabled=false;if(clear){overlay.innerHTML='';lastLines=[];lastRoi=null;canvas.classList.add('hidden');video.classList.remove('hidden');photoMode=false}}
function flash(){const f=document.getElementById('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),90)}
function captureFrame(){const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return false;canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);photoMode=true;video.classList.add('hidden');canvas.classList.remove('hidden');flash();return true}
function percentile(arr,p){const a=Array.from(arr);a.sort((x,y)=>x-y);return a[Math.max(0,Math.min(a.length-1,Math.floor(a.length*p)))]}
function smooth(a,r){const out=new Float32Array(a.length);for(let i=0;i<a.length;i++){let s=0,c=0;for(let j=Math.max(0,i-r);j<=Math.min(a.length-1,i+r);j++){s+=a[j];c++}out[i]=s/c}return out}
function getGray(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data,g=new Float32Array(canvas.width*canvas.height);for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=.299*d[i]+.587*d[i+1]+.114*d[i+2];return g}
function makeMasks(gray,w,h){const p10=percentile(gray,.10),p90=percentile(gray,.90),p75=percentile(gray,.75),p85=percentile(gray,.85),norm=new Float32Array(w*h);for(let i=0;i<gray.length;i++){let v=(gray[i]-p10)/(p90-p10+1)*255;norm[i]=Math.max(0,Math.min(255,(v-128)*1.45+128))}const thr=Math.max(120,(p75+p85)/2),mask=new Uint8Array(w*h),dark=new Uint8Array(w*h);let white=0;for(let i=0;i<gray.length;i++){const on=(norm[i]>150)||(gray[i]>thr);mask[i]=on?1:0;dark[i]=(gray[i]<115||norm[i]<90)?1:0;if(on)white++}return{w,h,gray,norm,mask,dark,white,thr}}
function groupBinary(arr,minLen,gap){let out=[],on=false,s=0,g=0;for(let i=0;i<arr.length;i++){if(arr[i]){if(!on){on=true;s=i}g=0}else if(on){g++;if(g>gap){let e=i-g;if(e-s+1>=minLen)out.push([s,e]);on=false;g=0}}}if(on&&arr.length-s>=minLen)out.push([s,arr.length-1]);return out}
function tightenLine(proc,line){const {w,h,mask}=proc;let x1=w,y1=h,x2=0,y2=0,pixels=0;const lx=Math.max(0,line.x-3),rx=Math.min(w-1,line.x+line.w+3),ty=Math.max(0,line.y-2),by=Math.min(h-1,line.y+line.h+2);for(let y=ty;y<=by;y++)for(let x=lx;x<=rx;x++)if(mask[y*w+x]){pixels++;if(x<x1)x1=x;if(x>x2)x2=x;if(y<y1)y1=y;if(y>y2)y2=y}if(!pixels)return null;const nw=x2-x1+1,nh=y2-y1+1,density=pixels/Math.max(1,nw*nh);return{x:x1,y:y1,w:nw,h:nh,pixels,density}}
function isGoodLine(l,proc){const area=l.w*l.h;if(l.w<proc.w*.07)return false;if(l.h<8||l.h>proc.h*.24)return false;if(l.pixels<Math.max(24,area*.010))return false;if(l.density<.008||l.density>.82)return false;return true}
function addCandidate(arr,c){if(!c)return;for(const e of arr){const oy=Math.max(0,Math.min(e.y+e.h,c.y+c.h)-Math.max(e.y,c.y));if(oy/Math.min(e.h,c.h)>.55){if(c.pixels>e.pixels)Object.assign(e,c);return}}arr.push(c)}
function detectROI(proc){const {w,h,mask,dark}=proc;let row=new Float32Array(h);for(let y=0;y<h;y++){let d=0,m=0;for(let x=0;x<w;x++){d+=dark[y*w+x];m+=mask[y*w+x]}const dr=d/w,wr=m/w;row[y]=(dr>.22&&wr>.002)?1:0}let groups=groupBinary(Array.from(row),Math.max(40,Math.round(h*.08)),12);let best=null;for(const g of groups){const y1=g[0],y2=g[1];let minx=w,maxx=0,darkPix=0,whitePix=0;for(let y=y1;y<=y2;y++)for(let x=0;x<w;x++){if(dark[y*w+x])darkPix++;if(mask[y*w+x]){whitePix++;if(x<minx)minx=x;if(x>maxx)maxx=x}}const gh=y2-y1+1,gw=maxx-minx+1,score=whitePix*1.2+darkPix*.08+gw*gh*.002;if(whitePix>80&&gw>w*.30&&gh>h*.08){const roi={x:Math.max(0,minx-20),y:Math.max(0,y1-12),w:Math.min(w,gw+40),h:Math.min(h-y1,gh+24),score};if(!best||roi.score>best.score)best=roi}}
 if(!best){best={x:Math.round(w*.05),y:Math.round(h*.05),w:Math.round(w*.90),h:Math.round(h*.70),score:0}}
 // reduce lower white-label/icon area by keeping upper large dark text region
 best.y=Math.max(0,best.y);best.h=Math.min(h-best.y,best.h);return best}
function detectLines(proc,roi){const {w,h,mask,norm}=proc;let profile=new Float32Array(h);const rx1=Math.max(0,roi.x),rx2=Math.min(w-1,roi.x+roi.w),ry1=Math.max(0,roi.y),ry2=Math.min(h-1,roi.y+roi.h);for(let y=ry1;y<=ry2;y++){let c=0,bright=0;for(let x=rx1;x<=rx2;x++){if(mask[y*w+x])c++;if(norm[y*w+x]>135)bright+=(norm[y*w+x]-135)/120}profile[y]=c+bright*.25}profile=smooth(profile,2);let maxV=0;for(let y=ry1;y<=ry2;y++)if(profile[y]>maxV)maxV=profile[y];let candidates=[];for(const ratio of [.48,.38,.30,.23,.17,.12,.08,.055]){const thr=Math.max(2,maxV*ratio),bin=new Array(h).fill(0);for(let y=ry1;y<=ry2;y++)bin[y]=profile[y]>=thr?1:0;const groups=groupBinary(bin,3,3).filter(g=>g[1]-g[0]+1<h*.25);for(const g of groups){const top=Math.max(ry1,g[0]-4),bottom=Math.min(ry2,g[1]+4);let minx=rx2,maxx=rx1,pix=0;for(let y=top;y<=bottom;y++)for(let x=rx1;x<=rx2;x++)if(mask[y*w+x]){pix++;if(x<minx)minx=x;if(x>maxx)maxx=x}const t=tightenLine(proc,{x:minx,y:top,w:maxx-minx+1,h:bottom-top+1});if(t&&isGoodLine(t,proc)&&t.y>=ry1&&t.y+t.h<=ry2+4)addCandidate(candidates,t)}}return candidates.sort((a,b)=>a.y-b.y)}
function binaryVec(proc,line,W,H){const out=[],{mask,w}=proc;for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){let sx0=Math.floor(line.x+xx*line.w/W),sx1=Math.max(sx0+1,Math.floor(line.x+(xx+1)*line.w/W));let sy0=Math.floor(line.y+yy*line.h/H),sy1=Math.max(sy0+1,Math.floor(line.y+(yy+1)*line.h/H));let sum=0,cnt=0;for(let sy=sy0;sy<sy1;sy++)for(let sx=sx0;sx<sx1;sx++){sum+=mask[sy*w+sx];cnt++}out.push(sum/cnt>.08?1:0)}return out}
function subLine(line,x0,x1,y0=0,y1=1){return{x:line.x+Math.round(line.w*x0),y:line.y+Math.round(line.h*y0),w:Math.max(4,Math.round(line.w*(x1-x0))),h:Math.max(4,Math.round(line.h*(y1-y0))),pixels:line.pixels,density:line.density}}
function projection(proc,line,bins,axis){const arr=new Array(bins).fill(0),{mask,w}=proc;if(axis==='x'){for(let i=0;i<bins;i++){let x0=Math.floor(line.x+i*line.w/bins),x1=Math.max(x0+1,Math.floor(line.x+(i+1)*line.w/bins));let sum=0,cnt=0;for(let y=line.y;y<line.y+line.h;y++)for(let x=x0;x<x1;x++){sum+=mask[y*w+x];cnt++}arr[i]=sum/Math.max(1,cnt)}}else{for(let i=0;i<bins;i++){let y0=Math.floor(line.y+i*line.h/bins),y1=Math.max(y0+1,Math.floor(line.y+(i+1)*line.h/bins));let sum=0,cnt=0;for(let y=y0;y<y1;y++)for(let x=line.x;x<line.x+line.w;x++){sum+=mask[y*w+x];cnt++}arr[i]=sum/Math.max(1,cnt)}}return arr}
function makeFeatures(proc,line){const tight=tightenLine(proc,line)||line,windows=[];[[0,.33],[.17,.50],[.33,.66],[.50,.83],[.67,1],[0,.50],[.25,.75],[.50,1]].forEach(r=>windows.push(binaryVec(proc,subLine(tight,r[0],r[1],.05,.95),80,18)));return{full:binaryVec(proc,tight,160,20),center:binaryVec(proc,subLine(tight,.10,.90,.05,.95),112,20),left:binaryVec(proc,subLine(tight,0,.62,.05,.95),90,18),right:binaryVec(proc,subLine(tight,.38,1,.05,.95),90,18),windows,xproj:projection(proc,tight,128,'x'),yproj:projection(proc,tight,20,'y'),aspect:tight.w/Math.max(1,tight.h),w:tight.w,h:tight.h,density:tight.density,pixels:tight.pixels}}
function simBin(a,b){const n=Math.min(a.length,b.length);if(!n)return 0;let same=0,inter=0,union=0;for(let i=0;i<n;i++){if(a[i]===b[i])same++;if(a[i]&&b[i])inter++;if(a[i]||b[i])union++}return same/n*.35+(union?inter/union:0)*.65}function simNum(a,b){const n=Math.min(a.length,b.length);if(!n)return 0;let dot=0,aa=0,bb=0;for(let i=0;i<n;i++){dot+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i]}return aa&&bb?dot/Math.sqrt(aa*bb):0}function aspectSim(a,b){return Math.exp(-Math.abs(Math.log((a||1)/(b||1))))}function legacyFeatures(m){return m.features?m.features:{full:m.vector||[],center:m.vector||[],left:m.vector||[],right:m.vector||[],windows:[m.vector||[]],xproj:[],yproj:[],aspect:m.width/Math.max(1,m.height)}}function compareFeatures(f,mf){if(!mf)return 0;const full=simBin(f.full,mf.full),center=simBin(f.center,mf.center),left=simBin(f.left,mf.left),right=simBin(f.right,mf.right);let bestWin=0;for(const a of f.windows||[])for(const b of mf.windows||[])bestWin=Math.max(bestWin,simBin(a,b));const proj=simNum(f.xproj,mf.xproj)*.75+simNum(f.yproj,mf.yproj)*.25,asp=aspectSim(f.aspect,mf.aspect),visualMax=Math.max(full,center,left,right,bestWin),visualAvg=(full+center+left+right+bestWin)/5;return Math.max(full*.25+center*.20+proj*.25+asp*.30,bestWin*.55+visualMax*.15+proj*.20+asp*.10,visualMax*.40+visualAvg*.20+proj*.30+asp*.10)}function compareToMemory(features){let best=null;for(const m of memory){const s=compareFeatures(features,legacyFeatures(m));if(!best||s>best.sim)best={item:m,sim:s}}return best}
function recognizePhoto(){const gray=getGray(),proc=makeMasks(gray,canvas.width,canvas.height),roi=detectROI(proc),lines=detectLines(proc,roi);lastRoi=roi;lastLines=[];for(let i=0;i<lines.length;i++){const l=lines[i],f=makeFeatures(proc,l),ink=f.full.reduce((a,b)=>a+b,0);let status='fail',sim=0,best=null;if(ink>=18&&f.density>=.008){best=compareToMemory(f);sim=best?best.sim:0;if(best&&sim>=DUP_THRESHOLD)status='match';else if(best&&sim>=SUSPECT_THRESHOLD)status='suspect'}lastLines.push({...l,index:i+1,status,sim})}drawOverlay()}
function drawOverlay(){overlay.innerHTML='';const m=coverMap();function add(cls,x,y,w,h){const d=document.createElement('div');d.className='box '+cls;d.style.left=(x*m.s+m.ox)+'px';d.style.top=(y*m.s+m.oy)+'px';d.style.width=Math.max(4,w*m.s)+'px';d.style.height=Math.max(6,h*m.s)+'px';overlay.appendChild(d)}if(lastRoi)add('roi',lastRoi.x,lastRoi.y,lastRoi.w,lastRoi.h);lastLines.forEach(l=>add(l.status,l.x,l.y,l.w,l.h))}
document.getElementById('startBtn').onclick=startCamera;document.getElementById('shotBtn').onclick=()=>{if(captureFrame()){recognizePhoto();document.getElementById('shotBtn').disabled=true}};document.getElementById('doneBtn').onclick=()=>{stopCamera(true)};window.onresize=drawOverlay;loadMemory();
</script>
</body>
</html>
